<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sdemux — stem separation</title>
  <link rel="icon" type="image/svg+xml" href="/sdemux/icon.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header id="app-header">
    <img src="/sdemux/icon.svg" alt="" width="24" height="24" class="header-icon">
    <span class="header-title">sdemux</span>
  </header>
  <div id="app">
    <div id="left-panel">
      <div id="drop-zone">
        <p class="drop-icon">🎵</p>
        <p>Drop audio here</p>
        <p class="hint">WAV / MP3</p>
        <input type="file" id="file-input" accept="audio/wav,audio/mpeg,audio/mp3" hidden>
      </div>
      <div id="source-player" style="display:none">
        <h3>Source</h3>
        <audio id="source-audio" controls></audio>
        <p id="source-info"></p>
      </div>
    </div>

    <svg id="fan-lines" viewBox="0 0 200 200" preserveAspectRatio="none">
      <line x1="12" y1="50" x2="188" y2="18" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="50" x2="188" y2="55" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="50" x2="188" y2="110" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="50" x2="188" y2="165" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

    <div id="right-panel">
    <div id="status"></div>
    <button id="separate-btn" style="display:none">Separate Stems</button>
    <div id="stem-cards"></div>
    <button id="download-all" style="display:none">Download All (ZIP)</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
