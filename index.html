<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sdemux — stem separation</title>
  <link rel="icon" type="image/svg+xml" href="/sdemux/icon.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div class="boombox-container">
  <!-- Handle bar -->
  <header class="handle-bar">
    <img src="/sdemux/icon.svg" alt="" width="28" height="28" class="logo-icon">
    <span class="logo">sdemux</span>
    <span class="subtitle">stem separation</span>
  </header>

  <!-- Boombox body -->
  <div class="boombox">
    <!-- Cassette deck (left) -->
    <div class="deck cassette-deck">
      <div class="cassette">
        <div class="cassette-label">htdemucs · 4-stem</div>
        <div class="cassette-body-inner">
          <div class="cassette-spools">
            <div class="spool left-spool" id="spool-left">
              <div class="spool-rim"></div>
              <div class="spool-hub"></div>
            </div>
            <div class="spool right-spool" id="spool-right">
              <div class="spool-rim"></div>
              <div class="spool-hub"></div>
            </div>
          </div>
          <div id="drop-zone" class="tape-window">
            <p class="drop-icon">&#9835;</p>
            <p>Drop audio</p>
            <p class="hint">WAV / MP3</p>
            <input type="file" id="file-input" accept="audio/wav,audio/mpeg,audio/mp3" hidden>
          </div>
        </div>
      </div>
      <div id="source-player" class="source-section" style="display:none">
        <p class="source-label">SOURCE</p>
        <audio id="source-audio" controls></audio>
        <p id="source-info"></p>
      </div>
    </div>

    <!-- Speaker section (right) -->
    <div class="deck speaker-deck">
      <div class="speaker-grille">
        <div class="speaker-ring r1"></div>
        <div class="speaker-ring r2"></div>
        <div class="speaker-ring r3"></div>
        <div class="speaker-dome"></div>
      </div>
      <div class="stems-area">
        <div id="status" class="status-text">Drop an audio file to begin</div>
        <button id="separate-btn" class="btn-action" style="display:none">&#9654; Separate</button>
        <div id="stem-cards" class="stem-grid"></div>
        <button id="play-all" class="btn-play" style="display:none">&#9654; Play All</button>
        <button id="download-all" class="btn-download" style="display:none">&#128230; Download All</button>
      </div>
    </div>
  </div>

  <!-- Ventilation slots -->
  <div class="vent-slots">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
<script data-goatcounter="https://track.joverval.cl/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
